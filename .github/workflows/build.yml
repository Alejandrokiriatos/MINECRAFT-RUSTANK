name: Build Rustank

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rustank-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Forge mod and generate world preview
        run: gradle build generateWorldPreview --no-daemon

      - name: Smoke test dedicated Forge server
        shell: bash
        run: |
          mkdir -p run/server
          printf '%s\n' 'eula=true' > run/server/eula.txt
          printf '%s\n' 'online-mode=false' 'server-port=25575' 'level-name=rustank-smoke-world' > run/server/server.properties
          set +e
          timeout 240s gradle runServer --no-daemon --console=plain > server-smoke.log 2>&1
          server_status=$?
          set -e
          cat server-smoke.log
          if grep -Eq 'Done \\(' server-smoke.log; then
            echo 'Dedicated Forge server reached the ready state.'
          else
            echo "Dedicated server did not reach ready state (exit $server_status)."
            exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: rustank-forge-26.1.2
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload world preview
        uses: actions/upload-artifact@v4
        with:
          name: rustank-world-preview
          path: build/reports/rustank-world-preview.png
          if-no-files-found: error
